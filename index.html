<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة المستندات الرقمية</title>
    <!-- استيراد خط تجريد عصري من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --transition: all 0.25s ease-in-out;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .file-box {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .file-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            border-color: #cbd5e1;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-grow: 1;
            margin-left: 20px;
        }

        .file-icon {
            background: #eef2ff;
            color: var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .file-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-view {
            background: #eef2ff;
            color: var(--primary);
        }

        .btn-view:hover {
            background: var(--primary);
            color: white;
        }

        .btn-download {
            background: #ecfdf5;
            color: var(--success);
        }

        .btn-download:hover {
            background: var(--success);
            color: white;
        }

        /* تحسين التجاوب مع الجوال */
        @media (max-width: 640px) {
            .file-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .file-info {
                margin-left: 0;
            }
            .buttons-group {
                width: 100%;
                justify-content: stretch;
            }
            .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>مكتبة المستندات</h2>
    </header>
